# cargo-mutants configuration
# https://mutants.rs/config.html
#
# Whole-function exclusions use #[mutants::skip] on the function itself
# (with a comment explaining why). This file is for specific mutation
# patterns within otherwise-testable functions.

# Use the mutants profile (no debug symbols) for faster builds.
profile = "mutants"

# Skip doctests (none in this project, avoids discovery overhead).
additional_cargo_test_args = ["--all-targets"]

exclude_re = [
    # split_long_line: the outer `while remaining.len() > max_bytes` loop.
    # Replacing `>` with `<` produces an infinite loop for any input shorter
    # than max_bytes (we keep splitting `remaining` while the condition stays
    # true).  The mutation *is* caught — the test harness kills it after 20s —
    # but cargo-mutants classifies the kill as TIMEOUT (exit 2), not CAUGHT
    # (exit 0).  No assertion-based test can catch it faster because the
    # mutated function never returns.  Restructuring the loop moves the
    # mutation target but doesn't eliminate it.  See mutants.rs exit codes.
    "replace > with < in split_long_line",

    # next_line: the `n == 0` EOF check.  Replacing `==` with `!=` means EOF is
    # never detected, so the `loop` re-reads a zero-byte result forever and the
    # function never returns.  Same kill-but-classified-as-TIMEOUT situation as
    # `split_long_line` above, and for the same reason: no assertion-based test
    # can catch it, because any test that calls `next_line` hangs with it.
    #
    # Note this mutant was previously CAUGHT rather than TIMEOUT, but only by
    # accident: the old hand-rolled `\r\n` strip did `raw[raw.len() - 1]` on the
    # now-empty buffer and panicked on the underflow.  `slice::strip_suffix`
    # has no underflow to panic on, which is the point of using it.
    "replace == with != in LineReader<R>::next_line",
]
