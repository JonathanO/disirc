# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Deny any crate with a known security vulnerability
ignore = [
    # rustls-webpki 0.102.8 is pinned by serenity's transitive dep tokio-tungstenite 0.21 → rustls 0.22.
    # We cannot upgrade without a serenity release. Limited impact (requires compromised CA).
    { id = "RUSTSEC-2026-0049", reason = "transitive dep pinned by serenity; awaiting upstream update" },
    # rustls-webpki 0.102.8 name constraint vulnerabilities — same serenity dep chain as above.
    # Fix (>=0.103.12) requires a major version bump; 0.102.x is EOL.
    # Both require certificate misissuance + compromised CA to exploit.
    { id = "RUSTSEC-2026-0098", reason = "transitive dep pinned by serenity; 0.102.x is EOL, awaiting upstream update" },
    { id = "RUSTSEC-2026-0099", reason = "transitive dep pinned by serenity; 0.102.x is EOL, awaiting upstream update" },
    # rustls-webpki 0.102.8 CRL-parsing panic — same serenity dep chain as above; no patched
    # 0.102.x exists (fix line starts at 0.103.13, which our own deps are on). The panic is only
    # reachable via CertRevocationList::from_der on application-supplied CRLs; neither disirc,
    # serenity, tungstenite, nor our reqwest configuration supplies CRLs, so the code is unreachable.
    { id = "RUSTSEC-2026-0104", reason = "transitive dep pinned by serenity; CRL parsing unreachable (no CRLs configured anywhere)" },
    # rustls 0.22.4 — same serenity dep chain. No patched 0.22.x exists; our own rustls is
    # 0.23.46, which has the fix. serenity PR #3599 (tokio-tungstenite 0.23.1) removes 0.22.
    # 0346: Debug of the client session store shows secrets. Nothing formats that store, and
    # the attack needs local access with high privileges.
    { id = "RUSTSEC-2026-0346", reason = "transitive rustls 0.22 pinned by serenity; nothing Debug-formats the session store" },
    # 0349: an unauthenticated ServerHello downgrades a hybrid key exchange to classical.
    # rustls 0.22.4 has no hybrid group (only X25519, P-256, P-384), so there is nothing to downgrade.
    { id = "RUSTSEC-2026-0349", reason = "transitive rustls 0.22 pinned by serenity; 0.22 has no hybrid group to downgrade" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# ring has a non-standard licence file structure
[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
