# Mutation testing: run on PR diffs for fast feedback, full run on demand.

name: Mutation Testing

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Derandomized Hegel runs with no shrinking (see hegel.toml).
  HEGEL_DEFAULT_PROFILE: mutants

on:
  # Run on every pull request. "Mutants (PR diff)" is a required check, so a
  # paths filter blocks pull requests that do not change Rust code. If the diff
  # changes no Rust source files, cargo mutants stops before it builds.
  pull_request:
  workflow_dispatch:

jobs:
  incremental-mutants:
    name: Mutants (PR diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - uses: taiki-e/install-action@v2
        with:
          tool: wild-linker

      - name: Configure Wild linker
        run: |
          mkdir -p .cargo
          echo '[target.x86_64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "clang"' >> .cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=--ld-path=wild"]' >> .cargo/config.toml

      - name: Generate diff
        run: git diff origin/${{ github.base_ref }}.. | tee pr.diff

      - name: Run mutants on diff
        run: cargo mutants --no-shuffle -vV --in-diff pr.diff --in-place

      - name: Archive mutants.out
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-incremental.out
          path: mutants.out

  full-mutants:
    name: Mutants (full, shard ${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    # A single runner took 102 minutes for 655 mutants. Eight shards run in
    # parallel, and each one has its own time and memory limits. Round-robin
    # spreads slow mutants (for example, timeouts in one file) over the shards.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - uses: taiki-e/install-action@v2
        with:
          tool: wild-linker

      - name: Configure Wild linker
        run: |
          mkdir -p .cargo
          echo '[target.x86_64-unknown-linux-gnu]' >> .cargo/config.toml
          echo 'linker = "clang"' >> .cargo/config.toml
          echo 'rustflags = ["-C", "link-arg=--ld-path=wild"]' >> .cargo/config.toml

      - name: Run all mutants
        run: cargo mutants -vV --in-place --shard ${{ matrix.shard }}/8 --sharding round-robin

      - name: Archive mutants.out
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-full-${{ matrix.shard }}.out
          path: mutants.out
