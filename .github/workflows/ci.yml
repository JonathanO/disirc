name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run weekly on main, so new advisories fail without a push or a pull
  # request. rust-toolchain.toml pins the toolchain, so a new Rust release
  # cannot fail this run.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  lint:
    name: Lint (fmt, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --check

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

  # A new advisory can appear at any time, with no change in this repository.
  # It fails only the weekly scheduled run. On pushes and pull requests, the
  # step can fail but the job passes, so the check stays green and Renovate
  # can still merge. A job-level continue-on-error still shows a failed check.
  advisories:
    name: Advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        continue-on-error: ${{ github.event_name != 'schedule' }}
        with:
          command: check advisories

  test:
    name: Test (clippy, unit, integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
        env:
          # The weekly scheduled run explores new random inputs (see
          # hegel.toml). Other runs leave this empty, so Hegel uses the
          # derandomized `ci` profile.
          HEGEL_DEFAULT_PROFILE: ${{ github.event_name == 'schedule' && 'explore' || '' }}

  e2e:
    name: E2E (Layer 3 — real UnrealIRCd)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Run Layer 3 e2e tests
        run: cargo test --test e2e_irc -- --include-ignored --nocapture
