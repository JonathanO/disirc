# Settings for the Hegel property tests. Each section merges over the shipped
# profile of the same name. The `ci` profile stays derandomized and does not
# use the failure database, so CI runs are repeatable.
# Reference: https://docs.rs/hegeltest/latest/hegel/docs/settings/index.html

[profiles.development]
test_cases = 1000

[profiles.ci]
test_cases = 1000

# Mutation testing (`HEGEL_DEFAULT_PROFILE=mutants cargo mutants ...`).
# A mutant only needs to fail a test, so Hegel stops at the first
# counterexample and does not shrink it. Shrinking can run for minutes and
# make cargo mutants report a caught mutant as a timeout. Extending `ci`
# keeps runs derandomized, so each mutant gets the same result every run.
[profiles.mutants]
extends = "ci"
phases = ["explicit", "generate"]

# Weekly exploration (the scheduled CI run sets HEGEL_DEFAULT_PROFILE=explore).
# Pull requests and pushes use the derandomized `ci` profile, so they always
# run the same inputs and a new edge case cannot fail an unrelated change.
# This profile uses a fresh random seed and many more cases, so the weekly run
# searches new inputs. A failure prints a #[hegel::reproduce_failure("...")]
# line; add it to the test to replay the failure, then keep the input as an
# explicit test case.
[profiles.explore]
extends = "ci"
derandomize = false
test_cases = 20000
print_blob = true
