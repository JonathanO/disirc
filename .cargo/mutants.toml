# cargo-mutants configuration
# https://mutants.rs/config.html
#
# Whole-function exclusions use #[mutants::skip] on the function itself
# (with a comment explaining why). This file is for specific mutation
# patterns within otherwise-testable functions.

# Use the mutants profile (no debug symbols) for faster builds.
profile = "mutants"

# Skip doctests (none in this project, avoids discovery overhead).
additional_cargo_test_args = ["--all-targets"]

exclude_re = [
    # next_line: replacing the whole body with a constant `Ok(Some(...))`.
    # The framing.rs tests fail on these at once (`reads_crlf_line` asserts the
    # decoded line, and `eof_at_start_returns_none` asserts `is_none()`).  The
    # kill is still reported as TIMEOUT, because `do_handshake` and
    # `run_session` call `next_line` in a loop.  The mutated `next_line`
    # returns without awaiting anything, so those loops never yield.  The
    # test's `within_deadline` timer then cannot fire, and the test process
    # never exits to report the failure that the framing tests already found.
    # Nothing about next_line itself can fix that; the read loops are correct
    # to run until EOF.
    'replace LineReader<R>::next_line -> io::Result<Option<String>> with Ok\(Some',
]
